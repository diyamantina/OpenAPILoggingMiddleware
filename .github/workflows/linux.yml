name: Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Linux CI: full `swift build` + `swift test` in the official Swift container.
# Exercises the Glibc / non-Darwin code paths (cross-platform lock, JSON file
# handler, stream handler) end-to-end. Apple-SDK coverage lives in apple.yml.

jobs:
  linux:
    name: Swift ${{ matrix.swift }} on Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0"]
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test --parallel
