name: Bug report
description: Report incorrect or unexpected behaviour
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not file security issues here; see
        [SECURITY.md](../../SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal code sample or sequence of steps.
      render: swift
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "1.3.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - macOS
        - iOS
        - tvOS
        - watchOS
        - Linux
    validations:
      required: true
  - type: input
    id: swift
    attributes:
      label: Swift / toolchain version
      placeholder: "Swift 6.0, Xcode 16.0"
    validations:
      required: false
